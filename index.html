<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>学生案例</title>

  <style>
    /* Ensure main content is not hidden behind sidebar */
    #main-content {
      margin-left: 180px; /* matches sidebar width */
      padding: 20px;
    }

    /* Make iframe responsive */
    iframe.graph {
      width: 100%;
      height: 90vh;
      border: none;
    }

    /* Optional: ensure sidebar scrolls properly */
    #sidebar {
      width: 180px;
      position: fixed;
      top: 10px;
      bottom: 0;
      overflow-y: auto;
    }

    header.header {
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000;
      height: 20px;
    }

    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <section id="container">

    <!-- HEADER -->
    <header class="header black-bg">
      <div class="sidebar-toggle-box">
        <div class="fa fa-bars tooltips" data-placement="right" data-original-title="Toggle Navigation"></div>
      </div>

      <!-- <a href="index_d.html" class="logo"><b>dashboards</b></a> -->
    </header>

    <!-- SIDEBAR -->
    <aside>
      <div id="sidebar" class="nav-collapse">
        <ul class="sidebar-menu" id="nav-accordion">
  
          <li class="sub-menu">
            <a class="active" href="javascript:;">
              <i class="fa fa-desktop"></i>
              <span>Industry Examples</span>
            </a>
            <ul class="sub">
              <li><a href="index_jia.html">Henan</a></li>
              <li><a href="MM_Econ_index.html">Maoming</a></li>
              <li><a href="Travel_Guangzhou.html">Guangzhou</a></li>
              <li><a href="Economy_Wuchuan.html">Wuchuang</a></li>
              <li><a href="Econ_Zhongshan.html">Zhongshan</a></li>
              <li><a href="chinaStyle.html">Psychology</a></li>
            </ul>
          </li>

        </ul>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <section id="main-content">
      <section class="wrapper">

          <iframe id="dist1" src="chinaStyle.html" class="graph"></iframe>
        

      </section>
    </section>

  </section>

  <!-- JS -->
  <script src="lib/jquery/jquery.min.js"></script>
  <script src="lib/bootstrap/js/bootstrap.min.js"></script>
  <script class="include" type="text/javascript" src="lib/jquery.dcjqaccordion.2.7.js"></script>
  <script src="lib/jquery.scrollTo.min.js"></script>
  <script src="lib/jquery.nicescroll.js" type="text/javascript"></script>
  <script src="lib/jquery.sparkline.js"></script>
  <script src="lib/common-scripts.js"></script>
  <script type="text/javascript" src="lib/gritter/js/jquery.gritter.js"></script>
  <script type="text/javascript" src="lib/gritter-conf.js"></script>
<script>
  // Attach click event to all sidebar links
  document.querySelectorAll('.sub a').forEach(function(link) {
    link.addEventListener('click', function(event) {
      event.preventDefault(); // stop page navigation

      // Get the link's target HTML file
      const target = this.getAttribute('href');

      // Update iframe content
      document.getElementById('dist1').src = target;
    });
  });
</script>

</body>

</html>
